name: acm-leaderboard

x-app: &app
  image: ${ACM_IMAGE_REPOSITORY:-nicccce/acm-labrank}:${ACM_IMAGE_TAG:-1.1.0}
  init: true
  environment: &app-env
    NODE_ENV: production
    NEXT_TELEMETRY_DISABLED: "1"
    APP_URL: ${APP_URL:?Run setup first; see README.md}
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    TZ: UTC
    SYNC_ENABLED: ${SYNC_ENABLED:-false}
    CF_MIN_INTERVAL_MS: ${CF_MIN_INTERVAL_MS:-2000}
    QOJ_MIN_INTERVAL_MS: ${QOJ_MIN_INTERVAL_MS:-3000}
    LUOGU_MIN_INTERVAL_MS: ${LUOGU_MIN_INTERVAL_MS:-3000}
    QOJ_CONNECTION_ID: ${QOJ_CONNECTION_ID:-qoj-lab}
    LUOGU_CONNECTION_ID: ${LUOGU_CONNECTION_ID:-luogu-lab}
    QOJ_VNC_URL: ${QOJ_VNC_URL:-http://localhost:6080/vnc.html?autoconnect=1&resize=scale}
    SESSION_ENCRYPTION_KEY_FILE: /run/secrets/session_encryption_key
    NODE_USE_ENV_PROXY: ${NODE_USE_ENV_PROXY:-0}
    HTTPS_PROXY: ${PLATFORM_HTTPS_PROXY:-}
    HTTP_PROXY: ${PLATFORM_HTTPS_PROXY:-}
    NO_PROXY: localhost,127.0.0.1,::1,web,worker,db
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run setup first; see README.md}
      POSTGRES_USER: ${POSTGRES_USER:?Run setup first; see README.md}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup first; see README.md}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  migrate:
    <<: *app
    command: ["pnpm", "db:migrate"]
    restart: "no"
    depends_on:
      db: { condition: service_healthy }

  bootstrap:
    <<: *app
    command: ["pnpm", "admin:bootstrap"]
    restart: "no"
    environment:
      <<: *app-env
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-admin}
      ADMIN_BOOTSTRAP_PASSWORD_FILE: /run/secrets/admin_bootstrap_password
    secrets:
      - admin_bootstrap_password
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    <<: *app
    command: ["pnpm", "--filter", "@acm/web", "start"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_BIND_PORT:-3000}:3000"
    secrets:
      - session_encryption_key
    depends_on:
      bootstrap: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 3

  seed:
    <<: *app
    profiles: ["tools"]
    command: ["pnpm", "members:seed"]
    environment:
      <<: *app-env
      MEMBER_TEST_PASSWORD_FILE: /run/secrets/member_test_password
    secrets:
      - member_test_password

  worker:
    <<: *app
    image: ${ACM_IMAGE_REPOSITORY:-nicccce/acm-labrank}:worker-${ACM_IMAGE_TAG:-1.1.0}
    command: ["pnpm", "--filter", "@acm/worker", "start"]
    restart: unless-stopped
    environment:
      <<: *app-env
      QOJ_TRANSPORT: browser
      QOJ_BROWSER_EXECUTABLE: /usr/bin/chromium
      QOJ_BROWSER_HEADED: "true"
      QOJ_BROWSER_MANUAL_START: "false"
      QOJ_HUMAN_RETRIES: "0"
      QOJ_BROWSER_START_TARGET: ${QOJ_BROWSER_START_TARGET:-muhammad}
      QOJ_BROWSER_PROXY_SERVER: ${QOJ_BROWSER_PROXY_SERVER:-}
      QOJ_HTTP_TIMEOUT_MS: ${QOJ_HTTP_TIMEOUT_MS:-30000}
      QOJ_HTTP_RETRIES: ${QOJ_HTTP_RETRIES:-2}
      QOJ_HUMAN_TIMEOUT_MS: ${QOJ_HUMAN_TIMEOUT_MS:-120000}
      QOJ_HUMAN_CONFIRM_FILE: /app/.local/qoj-confirm.json
      QOJ_VNC_PASSWORD_FILE: /run/secrets/qoj_vnc_password
    secrets:
      - session_encryption_key
      - qoj_vnc_password
    ports:
      - "127.0.0.1:${QOJ_DESKTOP_PORT:-6080}:6080"
    shm_size: 1gb
    stop_grace_period: 30s
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1g,mode=1777
      - /app/.local:rw,nosuid,nodev,size=16m,uid=1000,gid=1000,mode=0700
      - /app/apps/worker/.local:rw,nosuid,nodev,size=16m,uid=1000,gid=1000,mode=0700
    cap_drop:
      - ALL
    depends_on:
      bootstrap: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "pnpm", "--filter", "@acm/worker", "health"]
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 3

volumes:
  pgdata:

secrets:
  session_encryption_key:
    file: ${SESSION_ENCRYPTION_KEY_FILE:-./.secrets/session-encryption-key}
  admin_bootstrap_password:
    file: ${ADMIN_BOOTSTRAP_PASSWORD_FILE:-./.secrets/admin-bootstrap-password}
  member_test_password:
    file: ./.secrets/member-test-password
  qoj_vnc_password:
    file: ${QOJ_VNC_PASSWORD_FILE:-./.secrets/qoj-vnc-password}
