# Opt-in container-owned Chromium desktop; never mounts a host browser profile.
# docker compose -f compose.yaml -f compose.qoj-browser.yaml up -d --build worker
services:
  worker:
    image: acm-leaderboard:qoj-browser
    build:
      target: worker-browser
    environment:
      QOJ_TRANSPORT: browser
      QOJ_CONNECTION_ID: ${QOJ_CONNECTION_ID:-qoj-lab}
      QOJ_BROWSER_EXECUTABLE: /usr/bin/chromium
      QOJ_BROWSER_HEADED: "true"
      QOJ_BROWSER_MANUAL_START: ${QOJ_BROWSER_MANUAL_START:-false}
      QOJ_BROWSER_START_TARGET: ${QOJ_BROWSER_START_TARGET:-muhammad}
      # qoj-container.mjs launches Chromium and injects a loopback-only CDP endpoint into Worker.
      QOJ_BROWSER_PROXY_SERVER: ${QOJ_BROWSER_PROXY_SERVER:-}
      QOJ_MIN_INTERVAL_MS: ${QOJ_MIN_INTERVAL_MS:-3000}
      QOJ_HTTP_TIMEOUT_MS: ${QOJ_HTTP_TIMEOUT_MS:-30000}
      QOJ_HTTP_RETRIES: ${QOJ_HTTP_RETRIES:-2}
      QOJ_HUMAN_TIMEOUT_MS: ${QOJ_HUMAN_TIMEOUT_MS:-120000}
      QOJ_HUMAN_RETRIES: ${QOJ_HUMAN_RETRIES:-2}
      QOJ_HUMAN_CONFIRM_FILE: /app/.local/qoj-confirm.json
      QOJ_VNC_PASSWORD_FILE: /run/secrets/qoj_vnc_password
    secrets:
      - qoj_vnc_password
    ports:
      - "127.0.0.1:${QOJ_DESKTOP_PORT:-6080}:6080"
    shm_size: 1gb
    stop_grace_period: 30s
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1g,mode=1777
      - /app/.local:rw,nosuid,nodev,size=16m,uid=1000,gid=1000,mode=0700
      - /app/apps/worker/.local:rw,nosuid,nodev,size=16m,uid=1000,gid=1000,mode=0700
    cap_drop:
      - ALL

secrets:
  qoj_vnc_password:
    file: ${QOJ_VNC_PASSWORD_FILE:-./.secrets/qoj-vnc-password}
