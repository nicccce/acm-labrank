name: Release images

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: acm_release_fixture
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:acm_release_fixture@127.0.0.1:5432/postgres
      NEXT_TELEMETRY_DISABLED: '1'
      IMAGE: nicccce/acm-labrank
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check release version
        id: release
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: |
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
      - name: Typecheck, lint and unit tests
        run: pnpm check
      - name: Previous-version data preservation and database regressions
        run: |
          pnpm upgrade:verify
          pnpm teams:verify
          pnpm users:verify
          pnpm personal:verify
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build application image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.release.outputs.version }}
          build-args: |
            APP_VERSION=${{ steps.release.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=release-app
          cache-to: type=gha,scope=release-app,mode=max
      - name: Build browser Worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: worker-browser
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:worker-${{ steps.release.outputs.version }}
          build-args: |
            APP_VERSION=${{ steps.release.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: |
            type=gha,scope=release-app
            type=gha,scope=release-worker
          cache-to: type=gha,scope=release-worker,mode=max
      - name: Verify HTTP and desktop/mobile browser workflows in release image
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          docker run --rm --network host --shm-size=1g --entrypoint pnpm \
            -e DATABASE_URL -e VERIFY_BROWSER_CHANNEL=chromium \
            -e VERIFY_BROWSER_EXECUTABLE=/usr/bin/chromium \
            "$IMAGE:worker-$VERSION" users:verify --http
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the verified application and Worker images
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:worker-$VERSION"
          docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
          docker tag "$IMAGE:worker-$VERSION" "$IMAGE:worker"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:worker"
          {
            echo "Released $IMAGE:$VERSION and $IMAGE:worker-$VERSION (linux/amd64)"
            echo "Source revision: $GITHUB_SHA"
            docker image inspect "$IMAGE:$VERSION" "$IMAGE:worker-$VERSION" \
              --format '{{json .RepoDigests}}'
          } >> "$GITHUB_STEP_SUMMARY"
