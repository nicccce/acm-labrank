name: acm-leaderboard

x-app: &app
  image: acm-leaderboard:local
  build:
    context: .
    target: runtime
  init: true
  environment: &app-env
    NODE_ENV: production
    NEXT_TELEMETRY_DISABLED: "1"
    APP_URL: ${APP_URL:?Run pnpm setup first}
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    TZ: UTC
    SYNC_ENABLED: ${SYNC_ENABLED:-false}
    CF_MIN_INTERVAL_MS: ${CF_MIN_INTERVAL_MS:-2000}
    QOJ_MIN_INTERVAL_MS: ${QOJ_MIN_INTERVAL_MS:-3000}
    LUOGU_MIN_INTERVAL_MS: ${LUOGU_MIN_INTERVAL_MS:-3000}
    QOJ_CONNECTION_ID: ${QOJ_CONNECTION_ID:-qoj-lab}
    LUOGU_CONNECTION_ID: ${LUOGU_CONNECTION_ID:-luogu-lab}
    SESSION_ENCRYPTION_KEY_FILE: /run/secrets/session_encryption_key
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run pnpm setup first}
      POSTGRES_USER: ${POSTGRES_USER:?Run pnpm setup first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm setup first}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  migrate:
    <<: *app
    command: ["pnpm", "db:migrate"]
    restart: "no"
    depends_on:
      db: { condition: service_healthy }

  bootstrap:
    <<: *app
    command: ["pnpm", "admin:bootstrap"]
    restart: "no"
    environment:
      <<: *app-env
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-admin}
      ADMIN_BOOTSTRAP_PASSWORD_FILE: /run/secrets/admin_bootstrap_password
    secrets:
      - admin_bootstrap_password
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    <<: *app
    command: ["pnpm", "--filter", "@acm/web", "start"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_BIND_PORT:-3000}:3000"
    secrets:
      - session_encryption_key
    depends_on:
      bootstrap: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 3

  worker:
    <<: *app
    command: ["pnpm", "--filter", "@acm/worker", "start"]
    restart: unless-stopped
    secrets:
      - session_encryption_key
    depends_on:
      bootstrap: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "pnpm", "--filter", "@acm/worker", "health"]
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 3

volumes:
  pgdata:

secrets:
  session_encryption_key:
    file: ${SESSION_ENCRYPTION_KEY_FILE:-./.secrets/session-encryption-key}
  admin_bootstrap_password:
    file: ${ADMIN_BOOTSTRAP_PASSWORD_FILE:-./.secrets/admin-bootstrap-password}
